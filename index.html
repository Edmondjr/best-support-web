<style>
/* Layout: one phone column (max 480px), fixed bottom tab bar, brand from the Best Support board (deep green, warm orange, mint ground) */
:root{
  --bg:#F6F9F7; --surface:#FFFFFF; --surface-2:#EBF2EE; --fg:#10201A; --muted:#52625B; --line:#DCE6E1;
  --green:#0B3D2E; --green-2:#0B6E4F; --green-ink:#0A6849; --green-soft:#E1F1E9;
  --orange:#E36A00; --orange-ink:#A04700; --orange-soft:#FFF0E2;
  --hi-bg:#FDE1CB; --hi-fg:#8A3B00; --mid-bg:#FFF1BF; --mid-fg:#664F00; --lo-bg:#D9EFE4; --lo-fg:#0A5A3F;
  --on-dark:#FFFFFF; --on-dark-muted:#BFE3D2;
  --shadow:0 1px 2px rgba(11,61,46,.06),0 6px 18px rgba(11,61,46,.07);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1310; --surface:#14201B; --surface-2:#1B2A23; --fg:#E6EFEA; --muted:#9DB1A8; --line:#26362F;
  --green:#0E4535; --green-2:#17805C; --green-ink:#63D3A6; --green-soft:#15342A;
  --orange:#E36A00; --orange-ink:#FFA864; --orange-soft:#32210F;
  --hi-bg:#4A2810; --hi-fg:#FFC394; --mid-bg:#3B3210; --mid-fg:#F1D777; --lo-bg:#163A2C; --lo-fg:#8FE0BC;
  --on-dark:#FFFFFF; --on-dark-muted:#A9D9C4; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1310; --surface:#14201B; --surface-2:#1B2A23; --fg:#E6EFEA; --muted:#9DB1A8; --line:#26362F;
  --green:#0E4535; --green-2:#17805C; --green-ink:#63D3A6; --green-soft:#15342A;
  --orange:#E36A00; --orange-ink:#FFA864; --orange-soft:#32210F;
  --hi-bg:#4A2810; --hi-fg:#FFC394; --mid-bg:#3B3210; --mid-fg:#F1D777; --lo-bg:#163A2C; --lo-fg:#8FE0BC;
  --on-dark:#FFFFFF; --on-dark-muted:#A9D9C4; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--green-ink)}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(108px + env(safe-area-inset-bottom,0px))}
.screen.nonav{padding-block:16px 40px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.h2{font-size:17px;font-weight:800}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--fg);text-decoration:none}
.li:first-child{border-top:0}
.ttl{font-weight:700;font-size:15px;line-height:1.3}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:40px;height:40px;border-radius:20px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.av.o{background:var(--orange-soft);color:var(--orange-ink)}
.av.lg{width:64px;height:64px;border-radius:32px;font-size:22px}
.badge{flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-hi{background:var(--hi-bg);color:var(--hi-fg)}
.b-mid{background:var(--mid-bg);color:var(--mid-fg)}
.b-lo{background:var(--lo-bg);color:var(--lo-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:800;font-size:15px;text-decoration:none;text-align:center}
.btn-cta{background:var(--orange);color:#fff;font-size:19px;min-height:56px;border-radius:999px}
.btn-dark{background:var(--green);color:#fff;font-size:19px;min-height:56px;border-radius:999px}
.btn-green{background:var(--green-2);color:#fff}
.btn-ghost{background:var(--surface);color:var(--green-ink);border:1.5px solid var(--line)}
.btn-danger{background:var(--surface);color:var(--hi-fg);border:1.5px solid var(--hi-bg)}
.btn-link{background:none;border:0;color:var(--green-ink);font-weight:700;text-decoration:underline;min-height:44px;padding:0 4px}
.btn-block{width:100%}
.iconbtn{flex:none;width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:var(--shadow);text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.in{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;width:100%;min-width:0}
textarea.in{height:auto;min-height:92px;padding:12px 14px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green-2);border-color:var(--green-2);color:#fff}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--green-2)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--green-soft);color:var(--green-ink);font-size:13px;font-weight:600;line-height:1.45}
.note svg{flex:none;margin-top:1px}
.note.o{background:var(--orange-soft);color:var(--orange-ink)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.err{color:var(--hi-fg);font-size:13px;font-weight:700}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;justify-content:center}
nav.tabs button[aria-current="page"]{color:var(--green-ink);font-weight:800}
nav.tabs button.fab{justify-self:center;width:58px;height:58px;border-radius:29px;background:var(--green);color:#fff;margin-top:-28px;box-shadow:0 8px 18px rgba(11,61,46,.32)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;width:min(440px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline;min-height:40px;padding:0 6px}

/* Splash and onboarding */
.splash{position:relative;overflow:hidden;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:96px 40px}
.splash .wave{position:absolute;left:0;width:100%;pointer-events:none}
.splash .wave.top{top:0;height:150px}
.splash .wave.bot{bottom:0;height:120px}
.splash img.logo{width:150px;height:150px;border-radius:34px;box-shadow:0 14px 30px rgba(11,61,46,.18);background:#fff}
.word{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}
.word .b{color:var(--green-ink)}
.word .s{color:var(--orange)}
.tagline{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.splash .cta{position:relative;width:100%;max-width:360px;margin-top:auto}
.onb{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 32px}
.onb .ill{flex:1;min-height:220px;display:grid;place-items:center;border-radius:28px;background:var(--surface-2)}
.onb .ill svg{width:min(280px,80%);height:auto}
.onb h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--orange)}
.skip{align-self:flex-end}

/* Illustrations */
.f-g{fill:var(--green)} .f-g2{fill:var(--green-2)} .f-gs{fill:var(--green-soft)} .f-o{fill:var(--orange)} .f-os{fill:var(--orange-soft)} .f-s{fill:var(--surface)} .f-l{fill:var(--line)} .f-y{fill:#F6B43C}
.s-w{stroke:#fff} .s-g{stroke:var(--green-2)} .s-o{stroke:var(--orange)}

/* Home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.beta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.beta b{background:var(--orange-soft);color:var(--orange-ink);font-size:10.5px;letter-spacing:.8px;padding:3px 7px;border-radius:6px}
.prio{background:var(--orange-soft);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prio .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prio .lab{color:var(--orange-ink);font-weight:800;font-size:15px}
.prio .main{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px;text-align:left;border:0;width:100%;color:var(--fg)}
.ring{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--p) * 1%),var(--line) 0)}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.why{font-size:13px;line-height:1.5;color:var(--fg)}
.why b{color:var(--orange-ink)}
.prio .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prio .btns.three{grid-template-columns:1fr 1fr auto}
.prep{border:1.5px dashed var(--orange);background:var(--surface)}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green-2);flex:none;margin:0}
.check.done span{text-decoration:line-through;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wk{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wk .d{font-size:11px;font-weight:800;color:var(--orange-ink);text-transform:uppercase;letter-spacing:.7px}
.wk .t{font-size:13.5px;font-weight:700;line-height:1.3}

/* Detail band */
.band{background:var(--green);color:var(--on-dark);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.band .top{align-self:stretch;display:flex;justify-content:space-between}
.band .iconbtn{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.band .bic{width:64px;height:64px;border-radius:32px;background:#fff;color:var(--orange);display:grid;place-items:center}
.band h1{font-size:22px;font-weight:800;line-height:1.2}
.band p{color:var(--on-dark-muted);font-size:13.5px;font-weight:600}
.lift{margin-top:-48px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--fg);background:none;border:0;text-decoration:none;min-height:44px;padding:4px 0;text-align:center;line-height:1.2}
.act .c{width:46px;height:46px;border-radius:23px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center}
.act[aria-disabled="true"]{opacity:.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0;padding-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-l{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.money{font-variant-numeric:tabular-nums;font-weight:800}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.story{background:var(--green);color:var(--on-dark);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.story p{font-size:15px;line-height:1.6}
.story .eyebrow{color:var(--on-dark-muted)}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border:0;background:none;color:var(--line);display:grid;place-items:center;padding:0}
.stars button[aria-pressed="true"]{color:var(--orange)}
.stars button[aria-pressed="true"] svg path{fill:currentColor}
.daygroup{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:4px 2px 0}
.tick{flex:none;width:30px;height:30px;border-radius:15px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0}
.tick[aria-checked="true"]{background:var(--green-2);border-color:var(--green-2);color:#fff}
.empty{text-align:center;padding:22px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
